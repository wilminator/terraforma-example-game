[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terraforma-example-game"
version = "0.1.0"
description = "An example game module for the TerraForma RPG Engine"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Allen Wilmes" }]
requires-python = ">=3.14"
dependencies = [
    # The engine, at a tagged release (pinned to the commit of v0.1.0 until the tag exists).
    "terraforma[sqlite] @ git+https://github.com/wilminator/terraforma@b10f2140d1c65a2188725bb8f8e8185d439760b2",
]

[project.optional-dependencies]
dev = ["terraforma[testing] @ git+https://github.com/wilminator/terraforma@b10f2140d1c65a2188725bb8f8e8185d439760b2"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/example_game"]

[tool.pytest.ini_options]
testpaths = ["tests"]
